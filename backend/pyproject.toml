[project]
name = "basecamp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.5",
    "fastapi[standard]>=0.115",
    "playwright>=1.64.1",
    "pypdf>=7.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
