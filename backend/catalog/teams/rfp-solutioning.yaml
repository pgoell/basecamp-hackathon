name: RFP Solutioning
description: >-
  Upload an RFP PDF. The orchestrator reads it, decides which leads the bid
  needs, and delegates to them in parallel. Leads such as the Cloud Architect
  and the Data Engineering Lead run their own specialists. Proposal (docx) out.
coordinator: rfp-orchestrator
# The pool of leads. A lead with members of its own (agent.yaml: members)
# delegates to that crew; the others may send out the helpers below.
members:
  - cloud-architect
  - data-engineer
  - delivery-lead
  - pricing-specialist
  - legal-reviewer
  - competitive-intel
helpers:
  - document-analyst
  - section-writer
  - fact-checker
input:
  label: RFP
  pdf: true
  sample: rfp-acme-corp.md
context:
  - product-overview.md
  - past-wins.json
kickoff: |
  An RFP has just landed. Read it, write your staffing analysis, delegate to
  the leads it needs in parallel, synthesise their reports, and produce the
  proposal response document.
