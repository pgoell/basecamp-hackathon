# Runs on GitHub's runners, never on the VPS: pull requests from forks run
# this workflow too.
name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Backend lint, catalog and tests
        working-directory: backend
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run python -m app.catalog
          ANTHROPIC_API_KEY=x uv run pytest -q
      - uses: oven-sh/setup-bun@v2
      - name: Frontend builds
        working-directory: frontend
        run: bun install --frozen-lockfile && bunx tsc && bun run build
