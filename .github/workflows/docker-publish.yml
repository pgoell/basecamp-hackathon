name: Publish image

# Builds <component>/Dockerfile and pushes ghcr.io/<owner>/<repo>/<component>
# tagged <version>, <major>.<minor>, <major> and latest.
# Run by release.yml; can also be run by hand to republish a version.

on:
  workflow_call:
    inputs:
      component: { required: true, type: string }
      version: { required: true, type: string }
  workflow_dispatch:
    inputs:
      component:
        required: true
        type: choice
        options: [backend, frontend]
      version:
        description: Semantic version to tag, e.g. 1.2.3 (must match an existing release tag)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.component }}-v${{ inputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.component }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=semver,pattern={{major}},value=v${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
