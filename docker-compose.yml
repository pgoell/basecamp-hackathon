# Local stack, same ports and env names as the server: http://localhost:3000
#   docker compose up --build
# ORCHESTRATOR=dummy fills the canvas without calling a model; set it to
# hierarchy and put ANTHROPIC_API_KEY in .env to run the real agents.
services:
  backend:
    build: ./backend
    environment:
      ORCHESTRATOR: ${ORCHESTRATOR:-dummy}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-unset}
      DATA_DIR: /data
      FRONTEND_INTERNAL_URL: http://frontend:3000
    volumes:
      - backend-data:/data
      # Edit agents and teams without rebuilding:
      - ./backend/catalog:/app/catalog:ro
    shm_size: 1gb
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  backend-data:
